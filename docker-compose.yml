services:
  postgres:
    image: postgres:16
    container_name: investguide-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: investguide
      POSTGRES_USER: investguide_user
      POSTGRES_PASSWORD: investguide_password
    ports:
      - "5432:5432"
    volumes:
      - investguide_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investguide_user -d investguide"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  investguide_postgres_data:
